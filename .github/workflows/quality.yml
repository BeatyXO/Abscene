name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Python syntax and project preflight
        run: |
          python -m py_compile contracts/abscene.py
          python scripts/preflight.py
      - name: GenVM lint
        env:
          GENVM_VERSION: v0.2.16
        run: genvm-lint check contracts/abscene.py
      - name: GenVM ABI schema
        env:
          GENVM_VERSION: v0.2.16
        run: genvm-lint schema contracts/abscene.py
      - name: Direct Mode and source tests
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
