name: Quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile contracts/abscene.py
      - run: python scripts/preflight.py
      - run: genvm-lint check contracts/abscene.py
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Production build
        env:
          VITE_CONTRACT_ADDRESS: '0x1111111111111111111111111111111111111111'
          VITE_EXPLORER_BASE: 'https://explorer-studio.genlayer.com'
        run: npm run build
