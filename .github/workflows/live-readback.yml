name: Live Readback

on:
  push:
    branches: [main]
    paths:
      - 'frontend/scripts/live-readback.mjs'
      - '.github/workflows/live-readback.yml'
  workflow_dispatch:

jobs:
  readback:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Read canonical StudioNet state
        run: node scripts/live-readback.mjs
      - name: Upload live readback
        uses: actions/upload-artifact@v4
        with:
          name: abscene-live-readback
          path: frontend/artifacts/live-readback.json
          if-no-files-found: error
